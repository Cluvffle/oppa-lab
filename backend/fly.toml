# fly.toml app configuration file generated for charming-api on 2026-07-17T13:07:37+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'charming-api'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_HOST = '0.0.0.0'
  APP_PORT = '8000'
  ENV = 'production'
  LOG_LEVEL = 'INFO'
  RELOAD = 'false'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
